# Builds EMEGames.exe on a Windows machine at GitHub.
#  - Actions tab > "Build Windows exe" > Run workflow: download the result
#    under "Artifacts" at the bottom of the run page.
#  - Push a tag such as v2.0 and the .exe is also attached to a Release.
name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller chess

      - name: Check that the program loads
        run: python -c "import eme_games; print(sorted(eme_games.GAMES))"

      - name: Build EMEGames.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name EMEGames eme_games.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\EMEGames.exe release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath EMEGames-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EMEGames-windows
          path: release/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EMEGames-windows.zip
            dist/EMEGames.exe
